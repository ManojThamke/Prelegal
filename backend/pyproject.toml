[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal API and static frontend server"
readme = "README.md"
authors = [
    { name = "ManojThamke", email = "manojthamke28@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "litellm>=1.103.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
prelegal-backend = "prelegal_backend:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
