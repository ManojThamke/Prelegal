services:
  prelegal:
    build: .
    image: prelegal
    container_name: prelegal
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    healthcheck:
      # The slim image has no curl, so probe with Python.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 1s  # Check every second while starting, so start scripts don't wait 30s.
